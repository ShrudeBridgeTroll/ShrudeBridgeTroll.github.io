<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0d27a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f0d27a"/>
    </linearGradient>
    <linearGradient id="lineGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="220" fill="#111111"/>

  <!-- corner flourishes -->
  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M30,30 L30,60 M30,30 L60,30"/>
    <path d="M1170,30 L1170,60 M1170,30 L1140,30"/>
    <path d="M30,190 L30,160 M30,190 L60,190"/>
    <path d="M1170,190 L1170,160 M1170,190 L1140,190"/>
  </g>

  <!-- small star accents -->
  <g fill="#d4af37">
    <path d="M120,55 l4,9 10,1 -7,7 2,10 -9,-5 -9,5 2,-10 -7,-7 10,-1 z" opacity="0.85"/>
    <path d="M1080,55 l4,9 10,1 -7,7 2,10 -9,-5 -9,5 2,-10 -7,-7 10,-1 z" opacity="0.85"/>
    <path d="M150,150 l2.5,5.5 6,0.6 -4.3,4.3 1.2,6 -5.4,-3 -5.4,3 1.2,-6 -4.3,-4.3 6,-0.6 z" opacity="0.5"/>
    <path d="M1050,150 l2.5,5.5 6,0.6 -4.3,4.3 1.2,6 -5.4,-3 -5.4,3 1.2,-6 -4.3,-4.3 6,-0.6 z" opacity="0.5"/>
  </g>

  <!-- name -->
  <text x="600" y="108" text-anchor="middle"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="72" font-weight="700"
        fill="url(#goldText)"
        letter-spacing="2">Jefferey Watts</text>

  <!-- divider line with small diamond -->
  <line x1="380" y1="135" x2="560" y2="135" stroke="url(#lineGold)" stroke-width="1.5"/>
  <rect x="596" y="130" width="8" height="8" fill="#d4af37" transform="rotate(45 600 134)"/>
  <line x1="640" y1="135" x2="820" y2="135" stroke="url(#lineGold)" stroke-width="1.5"/>

  <!-- tagline -->
  <text x="600" y="168" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24" letter-spacing="3"
        fill="#e8e8e8">WEB &amp; SOFTWARE DEVELOPER</text>
</svg>
